; Medidor de CO₂ con ESP32 y Sensirion SCD41.
; El firmware se compila en GitHub Actions; las pruebas de la lógica corren en la PC con "pio test -e native".

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
; La versión llega desde la etiqueta de git en GitHub Actions (PLATFORMIO_BUILD_FLAGS); sin etiqueta es "dev".
lib_deps =
    sensirion/Sensirion I2C SCD4x @ 1.1.0
    adafruit/Adafruit SSD1306 @ 2.5.17
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit NeoPixel @ 1.15.5
    tzapu/WiFiManager @ 2.0.17

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
