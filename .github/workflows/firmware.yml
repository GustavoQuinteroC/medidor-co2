name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  pruebas:
    name: Pruebas de la lógica (nativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio test -e native -v

  compilar:
    name: Compilar para ESP32
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0 esptool==5.4.0
      - name: Versión del firmware desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PLATFORMIO_BUILD_FLAGS=-DVERSION_FIRMWARE='\"${GITHUB_REF_NAME#v}\"'" >> "$GITHUB_ENV"
      - run: pio run -e esp32dev
      - name: Imagen única para instalar desde el navegador
        run: |
          B=.pio/build/esp32dev
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge-bin -o medidor-co2.bin \
            --flash-mode keep --flash-freq keep --flash-size keep \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin medidor-co2-ota.bin
          ls -l medidor-co2*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: medidor-co2*.bin
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" medidor-co2.bin medidor-co2-ota.bin --title "$GITHUB_REF_NAME" --notes "medidor-co2.bin es la imagen completa (se graba en 0x0, la usa el botón de instalar del sitio). medidor-co2-ota.bin es solo la aplicación."
